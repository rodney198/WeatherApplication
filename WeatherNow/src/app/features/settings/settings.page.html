<ion-content class="settings-page-content" [fullscreen]="true">
  <div class="settings-page-layout">
    <app-nav activeTab="settings"></app-nav>

    <main class="settings-main-stage">
      <div class="settings-header">
        <h1 class="page-title">Settings</h1>
      </div>

      <div class="settings-container">
        <ion-list class="settings-list">
          <ion-item>
            <ion-icon name="thermometer-outline" slot="start"></ion-icon>
            <ion-label>
              <h3>Temperature Unit</h3>
              <p>Choose between Celsius (°C) and Fahrenheit (°F)</p>
            </ion-label>
            <ion-toggle
              [checked]="temperatureUnit() === 'imperial'"
              (ionChange)="onTemperatureUnitChange($event)"
              aria-label="Toggle between Celsius and Fahrenheit"
            ></ion-toggle>
          </ion-item>

          <ion-item button (click)="onClearData()">
            <ion-icon name="trash-outline" slot="start" color="danger"></ion-icon>
            <ion-label>
              <h3>Clear All Data</h3>
              <p>Remove saved locations and reset preferences</p>
            </ion-label>
          </ion-item>
        </ion-list>

        <div class="app-info">
          <p class="app-name">WeatherNow</p>
          <p class="version">Version {{ version }}</p>
          <p class="description">Cross-Platform Weather Application</p>
          <p class="attribution">Powered by OpenWeatherMap</p>
        </div>
      </div>
    </main>
  </div>

  <ion-alert
    [isOpen]="showClearDataAlert()"
    header="Clear All Data"
    message="Are you sure? This will remove all saved locations and reset preferences to default."
    [buttons]="alertButtons"
    (didDismiss)="cancelClearData()"
  >
  </ion-alert>
</ion-content>
